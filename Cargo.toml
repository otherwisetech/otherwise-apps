[workspace]
resolver = "2"
members = ["crates/i18n", "crates/core", "crates/app"]
default-members = ["crates/i18n", "crates/core"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/otherwisetech/otherwise-apps"

[workspace.dependencies]
i18n = { path = "crates/i18n", package = "otherwise-apps-i18n" }
otherwise-core = { path = "crates/core", package = "otherwise-apps-core" }
# the shared integration layer (deep links, discovery, entities, Today, MCP hub)
otherwise-link = { git = "https://github.com/otherwisetech/otherwise-link", tag = "v0.2.0" }
otherwise-mcp-hub = { git = "https://github.com/otherwisetech/otherwise-link", tag = "v0.2.0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GPUI stack, same as genealogy-rs, diskmap and rama. Git deps move: Cargo.lock pins revs.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

[profile.dev]
opt-level = 1
# GPUI with debuginfo is ~10 GB of target/; keep it lean
debug = 0
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
