[package]
name = "otherwise-apps-core"
description = "Catalog, version checks, verified downloads and installs for Otherwise Apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "otherwise_core"

[dependencies]
i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
# HTTPS over rustls/ring, no OpenSSL (same as genealogy-rs)
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
trash = "5"

[dev-dependencies]
tempfile = "3"
