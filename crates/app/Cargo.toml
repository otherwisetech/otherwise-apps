[package]
name = "otherwise-apps-app"
description = "Install and update Otherwise Technologies' open-source desktop apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "otherwise-apps"
path = "src/main.rs"

[dependencies]
i18n.workspace = true
otherwise-core.workspace = true
anyhow.workspace = true
otherwise-link.workspace = true
otherwise-mcp-hub.workspace = true
otherwise-agent-panel.workspace = true
chrono.workspace = true
uuid = "1"
# GitHub star count (one GET a day)
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json.workspace = true
# the Vcity session token (Calendar → Vcity), same as expense
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true

# build.rs embeds the .exe icon; only pulled in when building on Windows
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
